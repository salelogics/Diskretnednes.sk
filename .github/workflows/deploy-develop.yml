name: Deploy develop to HostCreators

on:
  push:
    branches:
      - develop

# Prevent overlapping deployments; let an in-progress deploy finish.
concurrency:
  group: deploy-develop
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to development server
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.HOSTCREATORS_SSH_KEY }}
          # Abort the whole step as soon as any command exits non-zero.
          script_stop: true
          script: |
            set -e
            cd /var/www13/p10542/diskretnednes.sk/sub/dev
            git fetch origin
            git reset --hard origin/develop
            php84 artisan migrate --force
            php84 artisan optimize:clear
